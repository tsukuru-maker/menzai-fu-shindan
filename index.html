<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>免罪符診断｜あなたの言い訳、丸見えです。</title>

    <meta
        name="description"
        content="9問・30秒。答えに正解はありません。ただ、あなたが普段ついてる言い訳は、全部見えます。"
    >

    <!-- ==================================================
         OGP / Twitter カード
         og:url と og:image は絶対 URL で指定する。
         デプロイ先が決まったら tools/set_url.py で一括置換する。
         ================================================== -->

    <meta property="og:type" content="website">
    <meta property="og:title" content="免罪符診断｜あなたの言い訳、丸見えです。">
    <meta property="og:description" content="9問答えると、あなたが一番よく使う言い訳＝免罪符が8種類の中から判定されます。">
    <meta property="og:url" content="https://tsukuru-maker.github.io/menzai-fu-shindan/">
    <meta property="og:image" content="https://tsukuru-maker.github.io/menzai-fu-shindan/ogp.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:site_name" content="免罪符診断">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="免罪符診断｜あなたの言い訳、丸見えです。">
    <meta name="twitter:description" content="9問・30秒。答えに正解はありません。ただ、言い訳は全部見えます。">
    <meta name="twitter:image" content="https://tsukuru-maker.github.io/menzai-fu-shindan/ogp.png">

    <meta name="theme-color" content="#FFF7EC">

    <!-- ファビコンはインライン SVG（外部ファイルを増やさないため） -->
    <link
        rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23FF4D8D'/%3E%3Ctext x='32' y='45' font-family='sans-serif' font-size='34' font-weight='700' fill='%2316161A' text-anchor='middle'%3E%E5%85%8D%3C/text%3E%3C/svg%3E"
    >

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">

</head>

<body data-screen="start">

    <main id="app"></main>

    <footer class="site-footer">
        <span>免罪符診断</span>
    </footer>

    <noscript>
        <p style="padding:2rem;text-align:center;">
            この診断は JavaScript が必要です。ブラウザの設定を確認してください。
        </p>
    </noscript>

    <!-- 読み込み順は固定。ES modules は使わない（file:// で動かすため）
         data.js  コンテンツ定義
         logic.js 判定・シャッフル（tools/verify.js と同じ実装を使うため分離）
         app.js   画面 -->
    <script src="data.js"></script>
    <script src="logic.js"></script>
    <script src="app.js"></script>

</body>

</html>
